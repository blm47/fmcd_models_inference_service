[tool.poetry]
name = "python-online-gpu-fmcd-models"
version = "1.1.2"
description = "FMCD GPU inference service"
authors = ["MLOps <mlops@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
line-ending = "lf"
