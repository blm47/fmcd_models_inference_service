# Список моделей сервиса. Сейчас один элемент, при масштабировании до 7
# моделей просто дописываются новые элементы списка - код (loader/registry)
# не меняется.
models:
  - name: "cc"
    artifacts_dir: "artifacts/cc"
    weights_file: "model.pth"
    schema_file: "schema.json"
    calibrators_file: "calibrators.json"
    freq_encoding_file: "freq_encoding.parquet"

inference:
  device: "cuda"
  infer_batch_size: 500
  chunk_size: 5_000

# Значения S3 берутся из глобальных переменных окружения (пробрасываются
# Helm-ом в Deployment env). Здесь указываем не сами значения, а ИМЕНА
# переменных окружения, откуда их нужно читать.
s3:
  endpoint_url_env: "S3_ENDPOINT_URL"
  access_key_env: "S3_ACCESS_KEY"
  secret_key_env: "S3_SECRET_KEY"
  bucket_in_env: "S3_BUCKET_IN"
  bucket_out_env: "S3_BUCKET_OUT"
  region_env: "S3_REGION"
  use_ssl_env: "S3_USE_SSL"
  verify_ssl_env: "S3_VERIFY_SSL"

task:
  progress_update_interval_sec: 10

# Task tracker: где физически хранится состояние задач между подами.
# backend: "s3" (сейчас) | "redis"/"postgres" (заложено на будущее,
# смена значения не требует изменений в коде TaskManager/TaskStore).
# state_key/lock_key - относительно bucket_out (см. s3.bucket_out_env).
# Правило активности задачи - "1 активная задача на 1 под" (не на весь
# сервис) - позволяет сервису на N подах вести до N параллельных задач.
task_store:
  backend: "s3"
  state_key: "_system/fmcd_models/task_state.json"
  lock_key: "_system/fmcd_models/task_state.lock"
  lease_seconds: 60
  wait_timeout_sec: 300
  poll_interval_sec: 1.0
  retention_months: 6
