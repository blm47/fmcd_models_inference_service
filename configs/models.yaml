# Единственный источник настроек сервиса. Поля не переопределяются через ENV.
models:
  - name: "credit_cards"
    id_cols: ["customer_mdm_id", "partition_report_dt"]
    artifacts_dir: "artifacts/credit_cards"
    weights_file: "model.pth"
    schema_file: "schema.json"
    calibrators_file: "calibrators.json"
    freq_encoding_file: "freq_encoding.parquet"

inference:
  device: "cuda"
  infer_batch_size: 500
  chunk_size: 5000

# Один объект в S3_BUCKET_OUT. Удаление объектов не используются.
task_store:
  state_key: "_system/fmcd_models/task_state.json"
  cas_timeout_sec: 30
  cas_retry_interval_sec: 0.2
  poll_interval_sec: 3
  retention_months: 6
  max_pending_tasks: 1000
  heartbeat_interval_sec: 30
  heartbeat_timeout_sec: 180
  # Максимальное время без сохранённого прогресса, даже если heartbeat жив.
  progress_timeout_sec: 1800
  cleanup_interval_sec: 3600
  progress_update_interval_sec: 10
  connect_timeout_sec: 5
  read_timeout_sec: 10
  # Особенность используемого S3-сервера, который возвращает ETag в кавычках.
  strip_etag_quotes: true
