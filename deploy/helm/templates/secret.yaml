# Секрет S3-креденшлов создаётся отдельно вне Helm-релиза (SOPS/Sealed Secrets/
# Vault Injector), в values.yaml указывается только имя уже существующего Secret
# через s3.existingSecretName. Шаблон ниже — опциональный fallback, если Secret
# нужно создавать прямо через Helm (не рекомендуется для прод-кластеров).
{{- if .Values.s3.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.existingSecretName }}
type: Opaque
stringData:
  access-key: "{{ .Values.s3.accessKey }}"
  secret-key: "{{ .Values.s3.secretKey }}"
{{- end }}
