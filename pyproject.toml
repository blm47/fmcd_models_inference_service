[tool.poetry]
name = "python-online-gpu-fmcd-models"
version = "1.1.2"
description = "FMCD GPU inference service"
authors = ["MLOps <mlops@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.24,<2"
pydantic = ">=1.10,<2"
pandas = "==2.1.3"
nvidia-nccl-cu12 = "==2.27.3"
nvidia-cusparselt-cu12 = "==0.7.1"
nvidia-cusparse-cu12 = "==12.5.8.93"
nvidia-cusolver-cu12 = "==11.7.3.90"
nvidia-cufft-cu12 = "==11.3.3.83"
nvidia-cublas-cu12 = "==12.8.4.1"
nvidia-cudnn-cu12 = "==9.10.2.21"
torch = "==2.8.0"
python-dateutil = "==2.8.2"
fastapi = "==0.94.1"
uvicorn = "==0.27.0"
pyarrow = "==12.0.0"
boto3 = ">=1.35.76"
s3fs = ">=2025.3.0"
pyyaml = ">=6.0"
dadm-functions = "==0.5.5"
psutil = "==5.9.8"
nvidia-ml-py = ">=12.0"
psycopg = {version = ">=3.2,<4", extras = ["binary"]}
psycopg-pool = ">=3.2,<4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
line-ending = "lf"
