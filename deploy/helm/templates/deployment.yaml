apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fmcd-inference
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fmcd-inference
  template:
    metadata:
      annotations:
        checksum/config: {{ required "Передайте serviceConfig" .Values.serviceConfig | sha256sum }}
      labels:
        app: fmcd-inference
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: fmcd-inference
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /srv/app/configs
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: S3_ENDPOINT_URL
              value: "{{ .Values.s3.endpointUrl }}"
            - name: S3_BUCKET_IN
              value: "{{ .Values.s3.bucketIn }}"
            - name: S3_BUCKET_OUT
              value: "{{ .Values.s3.bucketOut }}"
            - name: S3_REGION
              value: "{{ .Values.s3.region }}"
            - name: S3_USE_SSL
              value: "{{ .Values.s3.useSsl }}"
            - name: S3_VERIFY_SSL
              value: "{{ .Values.s3.verifySsl }}"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecretName }}
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecretName }}
                  key: secret-key
            {{- $config := fromYaml (required "Передайте serviceConfig" .Values.serviceConfig) }}
            {{- if eq $config.task_store.backend "pg" }}
            - name: POSTGRES_URL
              value: {{ required "Передайте postgres.url" .Values.postgres.url | quote }}
            - name: POSTGRES_SCHEMA
              value: {{ required "Передайте postgres.schema" .Values.postgres.schema | quote }}
            - name: POSTGRES_TABLE_NAME
              value: {{ required "Передайте postgres.tableName" .Values.postgres.tableName | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.postgres.sslmode | quote }}
            - name: POSTGRES_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ required "Передайте postgres.existingSecretName" .Values.postgres.existingSecretName }}
                  key: login
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecretName }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz/liveness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: {{ .Values.probes.readinessTimeoutSeconds }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-fmcd-inference-config
