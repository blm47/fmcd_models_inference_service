openapi: 3.1.0
info:
  title: FMCD Inference Service
  description: 'Асинхронный GPU-инференс над parquet в S3. Любой под принимает заявки, свободный worker
    забирает их из общей очереди S3.


    **Airflow:** подготовить вход → `POST /infer` → опрашивать `GET /tasks/{task_id}/status` → при `DONE`
    забрать результат в Hadoop.


    **Статусы:** `QUEUED → RUNNING → FINALIZING → DONE`. Ошибка или таймаут переводит задачу в `FAILED`.
    Отмена: `QUEUED → ABORTED` или `RUNNING → ABORTING → ABORTED`.


    Повтор HTTP-запроса использует прежний ключ идемпотентности. Новая попытка расчёта требует нового
    ключа и очищенного выходного префикса. Не удаляйте системный файл очереди. `FAILED` по таймауту не
    подтверждает остановку старого PUT: повтор в тот же физический путь не имеет строгой изоляции.'
  version: 0.1.0
paths:
  /infer:
    post:
      tags:
      - inference
      summary: Поставить расчёт в очередь
      description: 'Принимает заявку независимо от занятости GPU текущего пода.


        До постановки проверяет модель, входные parquet и выходной префикс.

        Входные данные должны оставаться неизменными до завершения расчёта.

        Выход не должен содержать parquet или `_SUCCESS` и пересекаться с входом,

        системным файлом либо выходом незавершённой задачи.


        Одинаковый `idempotency_key` и параметры возвращают исходную задачу,

        в том числе завершённую, пока она хранится в истории. Ответ 202 означает

        принятие заявки, а не завершение расчёта. Новая задача имеет статус QUEUED.'
      operationId: infer_infer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InferRequest'
        required: true
      responses:
        '202':
          description: Заявка сохранена или найдена ранее принятая попытка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAcceptedResponse'
        '404':
          description: Модель или входной префикс не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт ключа, занятый выходной префикс или полная очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некорректные параметры, колонки или непустой выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: S3 недоступен. Повторите запрос с прежним ключом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tasks/{task_id}/status:
    get:
      tags:
      - tasks
      summary: Получить статус и прогресс расчёта
      description: 'Читает общую очередь, поэтому запрос можно направить на любой под.


        Airflow опрашивает этот метод до DONE, FAILED или ABORTED.

        Результат готов к чтению только при DONE. ETA является оценкой, а не дедлайном.

        `executor_alive` вычисляется по heartbeat и не подтверждает физическую

        остановку процесса при значении false.'
      operationId: get_task_status_tasks__task_id__status_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponse'
        '503':
          description: Не удалось прочитать или обновить очередь S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Задача не найдена или удалена из истории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/abort:
    post:
      tags:
      - tasks
      summary: Запросить отмену расчёта
      description: 'QUEUED отменяется сразу, RUNNING переходит в ABORTING.


        Worker завершает текущую операцию и подтверждает ABORTED при проверке отмены.

        Ответ ABORTING ещё не означает остановку. Для завершённой задачи возвращается

        её текущий статус. Этот метод не удаляет выходные файлы и не запускает повтор.'
      operationId: abort_task_tasks__task_id__abort_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAbortResponse'
        '503':
          description: Не удалось прочитать или обновить очередь S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Задача не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Задача FINALIZING уже публикует результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/active:
    get:
      tags:
      - tasks
      summary: Получить все незавершённые задачи
      description: Все незавершённые задачи, включая очередь и потерявших heartbeat исполнителей.
      operationId: get_active_tasks_tasks_active_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveTasksResponse'
        '503':
          description: Не удалось прочитать или обновить очередь S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz/liveness:
    get:
      tags:
      - health
      summary: Проверить работу потоков пода
      description: 200 при работающих consumer и monitor, иначе 503. Доступ к S3 не проверяет.
      operationId: health_healthz_liveness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /healthz/readiness:
    get:
      tags:
      - health
      summary: Проверить готовность пода
      description: 200 при работающих consumer и monitor, иначе 503. Доступ к S3 не проверяет.
      operationId: health_healthz_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health:
    get:
      tags:
      - health
      summary: Проверить состояние сервиса
      description: 200 при работающих consumer и monitor, иначе 503. Доступ к S3 не проверяет.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    ActiveTaskSummary:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Идентификатор задачи
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pod Id
          description: Под-исполнитель, null до назначения
        model_name:
          type: string
          title: Model Name
          description: Имя модели
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Один из незавершённых статусов
        progress_pct:
          type: number
          title: Progress Pct
          description: Сохранённый прогресс в процентах
        eta_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Eta Seconds
          description: Оценка оставшихся секунд, если доступна
        executor_alive:
          type: boolean
          title: Executor Alive
          description: Признак актуального heartbeat исполнителя
      type: object
      required:
      - task_id
      - pod_id
      - model_name
      - status
      - progress_pct
      - eta_seconds
      - executor_alive
      title: ActiveTaskSummary
    ActiveTasksResponse:
      properties:
        active_tasks:
          items:
            $ref: '#/components/schemas/ActiveTaskSummary'
          type: array
          title: Active Tasks
          description: Незавершённые задачи всех подов
      type: object
      required:
      - active_tasks
      title: ActiveTasksResponse
    ErrorResponse:
      properties:
        detail:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - items: {}
            type: array
          title: Detail
          description: Сообщение ошибки, отсутствующие колонки или список ошибок валидации
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: ok или unavailable
          examples:
          - ok
      type: object
      required:
      - status
      title: HealthResponse
    InferRequest:
      properties:
        idempotency_key:
          type: string
          maxLength: 256
          minLength: 1
          title: Idempotency Key
          description: Стабильный ключ одной попытки расчёта Airflow
          examples:
          - credit_cards/run-1/infer/attempt-1
        model_name:
          type: string
          minLength: 1
          title: Model Name
          description: Имя модели из configs/models.yaml
          examples:
          - credit_cards
        s3_input_path:
          type: string
          title: S3 Input Path
          description: Входной префикс внутри S3_BUCKET_IN с подготовленными parquet
          examples:
          - s3://input-bucket/data/run-1
        s3_output_path:
          type: string
          title: S3 Output Path
          description: Выходной префикс внутри S3_BUCKET_OUT без parquet и _SUCCESS
          examples:
          - s3://output-bucket/results/run-1
      type: object
      required:
      - idempotency_key
      - model_name
      - s3_input_path
      - s3_output_path
      title: InferRequest
    TaskAbortResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Идентификатор задачи
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Статус после запроса отмены. ABORTING требует ожидания
      type: object
      required:
      - task_id
      - status
      title: TaskAbortResponse
    TaskAcceptedResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Идентификатор задачи для опроса статуса и отмены
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pod Id
          description: Под-исполнитель, null до назначения
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Текущий статус, у новой заявки QUEUED
        total_rows:
          type: integer
          title: Total Rows
          description: Количество строк во входных данных
      type: object
      required:
      - task_id
      - pod_id
      - status
      - total_rows
      title: TaskAcceptedResponse
    TaskStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - DONE
      - FAILED
      - ABORTING
      - ABORTED
      - FINALIZING
      title: TaskStatus
    TaskStatusResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Идентификатор задачи
        model_name:
          type: string
          title: Model Name
          description: Имя модели из конфигурации
        pod_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pod Id
          description: Назначенный под, null до захвата задачи
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: DONE, FAILED и ABORTED — финальные статусы
        processed_rows:
          type: integer
          title: Processed Rows
          description: Количество обработанных строк по сохранённому прогрессу
        total_rows:
          type: integer
          title: Total Rows
          description: Количество входных строк
        progress_pct:
          type: number
          title: Progress Pct
          description: Прогресс в процентах. 100 ещё не означает DONE
        eta_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Eta Seconds
          description: Оценка оставшихся секунд, null если недоступна
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Причина ошибки или таймаута, null при отсутствии
        heartbeat_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Heartbeat At
          description: 'Последний heartbeat: Unix timestamp в секундах'
        executor_alive:
          type: boolean
          title: Executor Alive
          description: Признак актуального heartbeat, не проверка процесса
        s3_output_path:
          type: string
          title: S3 Output Path
          description: Физический S3-префикс результата. Читать после DONE
        created_at:
          type: number
          title: Created At
          description: 'Создание задачи: Unix timestamp в секундах'
        started_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Started At
          description: 'Начало расчёта: Unix timestamp, null до старта'
        finished_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Finished At
          description: 'Завершение: Unix timestamp, null до завершения'
      type: object
      required:
      - task_id
      - model_name
      - pod_id
      - status
      - processed_rows
      - total_rows
      - progress_pct
      - eta_seconds
      - error
      - heartbeat_at
      - executor_alive
      - s3_output_path
      - created_at
      - started_at
      - finished_at
      title: TaskStatusResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: inference
  description: Постановка расчёта в общую очередь.
- name: tasks
  description: Статусы, прогресс и отмена задач на всех подах.
- name: health
  description: Проверки готовности процесса для Kubernetes.
